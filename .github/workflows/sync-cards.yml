name: Karten-Sync

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC = 09:00 Berlin (CEST) / 08:00 Berlin (CET)
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Sync-Läufe gleichzeitig — sonst könnte digimoncard.dev an einem Tag
# doppelt getroffen werden. Ein zweiter Trigger wartet, bis der erste fertig ist.
concurrency:
  group: karten-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Abhängigkeiten installieren
        run: pip install Pillow

      - name: Karten synchronisieren
        run: python3 scripts/sync-cards.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "hankep"
          git config user.email "50618028+hankep@users.noreply.github.com"
          git add -A -- data/cards.data.js data/reveal-images.data.js data/reveal-cache
          # Nur committen, wenn sich echte Kartendaten/Bilder geändert haben. Eine
          # reine Aktualisierung des digimoncard.dev-Zeitstempels (.dcd-last-fetch)
          # allein löst KEINEN Commit aus — sonst gäbe es an ruhigen Tagen einen
          # täglichen Leer-Commit.
          changed=$(git diff --cached --name-only | grep -v '^data/reveal-cache/\.dcd-last-fetch$' || true)
          if [ -z "$changed" ]; then
            echo "Keine neuen Karten."
            exit 0
          fi
          git commit -m "Automatischer Karten-Sync (sync-cards.py)"
          git push
